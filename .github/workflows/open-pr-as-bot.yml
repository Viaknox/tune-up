# Opens a pull request authored by the viaknox-claude GitHub App, so that
# Paul can approve Claude-written PRs as a real second reviewer (GitHub does
# not let a PR author approve their own PR). Decision D6 / S0a in
# docs/CLI-PLAN.md (frontier-gate run 2026-10-16-s0a-identity).
#
# How it is used: a Claude session pushes a branch, then dispatches this
# workflow on main with the branch name, a title and a body.
#
# Safety:
# - The App private key lives only in the `pr-bot` environment, which is
#   restricted to the `main` branch, so only this file as merged on main can
#   read it; a PR that edits this file cannot reach the key.
# - The App can only open PRs (Pull requests: write, Contents: read). It cannot
#   push, merge or approve. Only Paul merges.
# - Inputs are passed through env vars, never interpolated into the script.
name: open-pr-as-bot

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to open the PR from (must already be pushed)
        required: true
        type: string
      title:
        description: PR title
        required: true
        type: string
      body:
        description: PR description (markdown)
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: open-pr-as-bot-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  open:
    name: Open PR as viaknox-claude
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pr-bot
    timeout-minutes: 5
    steps:
      - name: Mint a 1-hour App token (PR write only)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-contents: read

      - name: Open the PR (or report the existing one)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$BRANCH" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$'; then
            echo "::error::invalid branch name"; exit 1
          fi
          if [ "$BRANCH" = "main" ]; then
            echo "::error::refusing to open a PR from main"; exit 1
          fi
          if [ -z "$TITLE" ]; then
            echo "::error::title is required"; exit 1
          fi
          existing=$(gh pr list --repo "$REPO" --base main --head "$BRANCH" --state open --json url,isCrossRepository --jq '[.[] | select(.isCrossRepository | not)][0].url // ""')
          if [ -n "$existing" ]; then
            echo "PR already open: $existing"
            echo "### PR already open: $existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url=$(gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$TITLE" --body "$BODY")
          echo "Opened $url"
          echo "### Opened $url" >> "$GITHUB_STEP_SUMMARY"
